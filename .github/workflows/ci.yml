name: ci
on:
  push:
  pull_request:

env:
  CANCHO_REV: 93e49cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cancho-client-gen
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build the pinned compiler
        run: cargo build --release -p cancho
        working-directory: cancho
      - name: Build clientgen
        run: |
          export CANCHO=$GITHUB_WORKSPACE/cancho/target/release/cancho
          $CANCHO check cancho-client-gen/src/clientgen.cho --std --backend cranelift
          $CANCHO fmt --check cancho-client-gen/src/
          $CANCHO build --std --backend cranelift cancho-client-gen/src/clientgen.cho -o cancho-client-gen/build/clientgen
      - name: The reader over the byte-verified document
        run: python3 tests/e2e.py
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
          BIN: ${{ github.workspace }}/cancho-client-gen/build/clientgen
      - name: The authority report
        run: |
          $CANCHO authority cancho-client-gen/src/clientgen.cho --std > docs/authority.json
          git diff --exit-code -- docs/authority.json
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
