name: ci
on:
  push:
  pull_request:

env:
  CANCHO_REV: 93e49cd
  WEB_REV: e4dccd7

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cancho-client-gen
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build the pinned compiler
        run: cargo build --release -p cancho
        working-directory: cancho
      - name: Build clientgen
        run: |
          export CANCHO=$GITHUB_WORKSPACE/cancho/target/release/cancho
          $CANCHO check cancho-client-gen/src/clientgen.cho cancho-client-gen/src/model.cho cancho-client-gen/src/ts.cho cancho-client-gen/src/gow.cho cancho-client-gen/src/py.cho cancho-client-gen/src/cancho.cho --std --backend cranelift
          $CANCHO fmt --check cancho-client-gen/src/
          $CANCHO build --std --backend cranelift cancho-client-gen/src/clientgen.cho cancho-client-gen/src/model.cho cancho-client-gen/src/ts.cho cancho-client-gen/src/gow.cho cancho-client-gen/src/py.cho cancho-client-gen/src/cancho.cho -o cancho-client-gen/build/clientgen
      - name: The reader and the model, over the byte-verified document
        run: python3 tests/e2e.py
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
          BIN: ${{ github.workspace }}/cancho-client-gen/build/clientgen
      - name: The authority report
        run: |
          $CANCHO authority cancho-client-gen/src/clientgen.cho cancho-client-gen/src/model.cho cancho-client-gen/src/ts.cho --std > docs/authority.json
          git diff --exit-code -- docs/authority.json
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho

  # The gate (#6): the committed client is what the pinned document says,
  # and it agrees with the running service -- server and client cannot
  # disagree silently.
  the-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cancho-client-gen
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-web
          ref: ${{ env.WEB_REV }}
          path: cancho-web
      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-schema
          ref: 59a70285ff23af63a226bc56ff978feccb4cf8ca
          path: cancho-schema
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build the pinned compiler
        run: cargo build --release -p cancho
        working-directory: cancho
      - name: Build clientgen
        run: |
          export CANCHO=$GITHUB_WORKSPACE/cancho/target/release/cancho
          $CANCHO build --std --backend cranelift cancho-client-gen/src/clientgen.cho cancho-client-gen/src/model.cho cancho-client-gen/src/ts.cho cancho-client-gen/src/gow.cho cancho-client-gen/src/py.cho cancho-client-gen/src/cancho.cho -o cancho-client-gen/build/clientgen
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: The committed clients match the pinned document
        run: scripts/check-client.sh
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
          BIN: ${{ github.workspace }}/cancho-client-gen/build/clientgen
      - name: The committed Go client builds and vets
        run: |
          cd examples/users/go
          go build ./...
          go vet ./...
        working-directory: cancho-client-gen
      - name: The committed cancho client checks and is fmt-canonical
        run: |
          $CANCHO check examples/users/cho/client.cho --std --backend cranelift || [ "$?" = "100" ]
          $CANCHO fmt --check examples/users/cho/client.cho
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
      - name: The committed Python client passes mypy --strict
        run: |
          pip install mypy
          python3 -m mypy --strict examples/users/py/client.py
        working-directory: cancho-client-gen
      - name: The committed client against the running users service
        run: node tests/client_e2e.mjs
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
          WEB_DIR: ${{ github.workspace }}/cancho-web
          CANCHO_DIR: ${{ github.workspace }}/cancho
          SCHEMA_DIR: ${{ github.workspace }}/cancho-schema
      - name: The committed Python client against the running users service
        run: python3 tests/client_e2e.py
        working-directory: cancho-client-gen
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
          WEB_DIR: ${{ github.workspace }}/cancho-web
          CANCHO_DIR: ${{ github.workspace }}/cancho
          SCHEMA_DIR: ${{ github.workspace }}/cancho-schema
